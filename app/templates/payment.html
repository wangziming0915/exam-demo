<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Demo Payment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }

        .row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .row input {
            flex: 1;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #635bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #5848ea;
        }

        .note {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Demo Payment</h2>

    <form action="/payment/confirm" method="POST">
        <label>Card Number</label>
        <input type="text" name="card" placeholder="1234 5678 9012 3456">

        <label>Name on Card</label>
        <input type="text" name="name" placeholder="John Doe">

        <div class="row">
            <div>
                <label>Expiration</label>
                <input type="text" name="exp" placeholder="MM/YY">
            </div>
            <div>
                <label>CVV</label>
                <input type="text" name="cvv" placeholder="123">
            </div>
        </div>

        <button type="submit">Pay Now</button>
    </form>

    <div class="note">This is a demo page. No real payment will be processed.</div>
</div>

</body>
</html>
